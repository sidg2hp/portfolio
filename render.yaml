services:
  - type: web
    name: siddhartha-portfolio
    runtime: node
    plan: free
    domains:
      - sidg.dev
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/contact
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
